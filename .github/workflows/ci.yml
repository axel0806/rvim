# CI: tests, clippy and fmt on Linux, macOS and Windows. Runs on pushes to
# main and ci-* branches, and on pull requests. release.yml is separate and
# builds the binaries.
#
# Vim: the differential tests compare rvim with a real Vim, and every runner
# must have Vim present (RVIM_REQUIRE_VIM=1, so a missing Vim fails the job).
# The Vim version each runner uses is printed in the "Vim present?" step.
#   Linux:   Vim 9.1.1914 built from the pinned tag, the version the tests are
#            written against. Built from source because distro packages lag
#            (Ubuntu's apt Vim, "9.1 (2024 Jan 02)", differs on ''-after-:N).
#            Cached under ~/vim-9.1.1914 by runner image.
#   macOS:   Homebrew's current Vim (9.2.x).
#   Windows: Chocolatey's current Vim (9.2.x), found by the PATH step.
# A failure that comes from a different Vim version needs a look (is it rvim,
# or Vim's behaviour?), not a skip.
name: ci
on:
  push:
    branches: [main, 'ci-*']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      RVIM_REQUIRE_VIM: 1
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Vim cache key (Linux)
        if: runner.os == 'Linux'
        id: vim-key
        run: echo "key=vim-v9.1.1914-${ImageOS:-unknown}-$(uname -m)" >> "$GITHUB_OUTPUT"
      - name: Restore Vim 9.1.1914 (Linux)
        if: runner.os == 'Linux'
        id: vim-cache
        uses: actions/cache@v4
        with:
          path: ~/vim-9.1.1914
          key: ${{ steps.vim-key.outputs.key }}
      - name: Build Vim 9.1.1914 (Linux, cache miss)
        if: runner.os == 'Linux' && steps.vim-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev
          git clone --depth 1 --branch v9.1.1914 https://github.com/vim/vim "$RUNNER_TEMP/vim-src"
          cd "$RUNNER_TEMP/vim-src/src"
          ./configure --with-features=huge --disable-gui --without-x --disable-nls \
            --prefix="$HOME/vim-9.1.1914"
          make -j"$(nproc)"
          make install
      - name: Add Vim to PATH (Linux)
        if: runner.os == 'Linux'
        run: echo "$HOME/vim-9.1.1914/bin" >> "$GITHUB_PATH"
      - name: Install Vim (macOS)
        if: runner.os == 'macOS'
        run: brew install vim
      - name: Install Vim (Windows)
        if: runner.os == 'Windows'
        run: choco install vim -y
      - name: Add Vim to PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Chocolatey's vim package extracts the zip to C:\tools\vim\vim9N\
          # (no shim), so search there first, then the Program Files roots.
          $roots = @(
            'C:\tools',
            'C:\Program Files',
            'C:\Program Files (x86)',
            'C:\ProgramData\chocolatey\lib\vim',
            'C:\ProgramData\chocolatey\bin'
          )
          $found = @()
          foreach ($root in $roots) {
            if (Test-Path -LiteralPath $root) {
              $found += Get-ChildItem -LiteralPath $root -Recurse -Depth 5 -Filter vim.exe -File -ErrorAction SilentlyContinue
            }
          }
          # Rank: the vim9N\vim.exe layout first, then the choco and Vim
          # install roots, then anything else (e.g. a Git for Windows vim).
          $ranked = $found | Sort-Object -Property @{ Expression = {
              if ($_.FullName -match '\\vim\d+\\vim\.exe$') { 0 }
              elseif ($_.FullName -match '^C:\\(tools|ProgramData\\chocolatey)\\|^C:\\Program Files( \(x86\))?\\Vim\\') { 1 }
              else { 2 }
            } }, @{ Expression = { $_.FullName }; Descending = $true }
          if (-not $ranked) {
            throw "vim.exe not found after choco install. Searched (depth 5) under: $($roots -join ', ')"
          }
          $exe = $ranked[0]
          Write-Host "Using $($exe.FullName); other candidates: $(($ranked | Select-Object -Skip 1 | ForEach-Object FullName) -join ', ')"
          $exe.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Vim present?
        run: |
          if ! command -v vim >/dev/null 2>&1; then
            echo "::error::vim not found on ${{ matrix.os }}"
            exit 1
          fi
          vim --version > vim-version.txt
          head -n 2 vim-version.txt
          grep -q 'Included patches' vim-version.txt || echo "(this build prints no 'Included patches' line)"
          if [ "$RUNNER_OS" = "Linux" ] && ! grep -q 'Included patches: 1-1914' vim-version.txt; then
            echo "::error::expected Vim 9.1.1914 on Linux"
            exit 1
          fi
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
