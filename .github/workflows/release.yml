name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, ext: "" }
          - { os: macos-latest, target: aarch64-apple-darwin, ext: "" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ext: ".exe" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name=rvim-${{ github.ref_name }}-${{ matrix.target }}
          mkdir "$name"
          cp target/${{ matrix.target }}/release/rvim${{ matrix.ext }} LICENSE* README* "$name"/ 2>/dev/null || cp target/${{ matrix.target }}/release/rvim${{ matrix.ext }} "$name"/
          if [ "${{ matrix.ext }}" = ".exe" ]; then 7z a "$name.zip" "$name"; echo "ASSET=$name.zip" >> $GITHUB_ENV
          else tar czf "$name.tar.gz" "$name"; echo "ASSET=$name.tar.gz" >> $GITHUB_ENV; fi
      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --prerelease --title "${{ github.ref_name }}" --notes "Alpha release. Milestones 1-3 of PLAN.md: Normal/Insert/Visual modes, operators, registers, undo, search, Ex commands. No windows, buffers, marks or macros yet." 2>/dev/null || true
          gh release upload "${{ github.ref_name }}" "$ASSET" --repo "${{ github.repository }}" --clobber
