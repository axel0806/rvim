[package]
name = "rvim"
version = "0.1.0"
edition = "2024"
description = "A Vim-compatible text editor in Rust, derived from Vim"
license = "Apache-2.0 AND Vim"
repository = "https://github.com/axel0806/rvim"

[dependencies]
crossterm = "0.29"
ropey = { version = "1", default-features = false, features = ["simd"] }
unicode-width = "0.2.3"
# The config file (src/config.rs). Default features: `Table` and `Value`
# need the `serde` feature, which adds only serde_core (no derive macros).
toml = "1.1.8"

# SIGHUP and SIGTERM on Unix (src/signals.rs). crossterm already depends on
# signal-hook 0.3, so this adds no crate to the build.
[target.'cfg(unix)'.dependencies]
signal-hook = "0.3.18"

[dev-dependencies]
tempfile = "3.27.0"
