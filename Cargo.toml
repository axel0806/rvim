[package]
name = "rvim"
version = "0.1.0"
edition = "2024"
description = "A Vim-compatible text editor in Rust, derived from Vim"
license = "Vim"
repository = "https://github.com/axel0806/rvim"

[dependencies]
crossterm = "0.29"
ropey = { version = "1", default-features = false, features = ["simd"] }
unicode-width = "0.2.3"

[dev-dependencies]
tempfile = "3.27.0"
