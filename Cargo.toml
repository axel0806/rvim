[package]
name = "rvim"
version = "0.1.0"
edition = "2024"
description = "A Vim-compatible text editor in Rust, derived from Vim"
license = "Apache-2.0 AND Vim"
repository = "https://github.com/axel0806/rvim"

[dependencies]
crossterm = "0.29"
ropey = { version = "1", default-features = false, features = ["simd"] }
unicode-width = "0.2.3"
# The config file (src/config.rs). `Table` and `Value` need the `serde`
# feature. The cost is in PLAN.md, "Dependency choices" (about +23% release
# binary); `display` (writing TOML) is not needed.
toml = { version = "1.1.8", default-features = false, features = ["std", "serde", "parse"] }

# SIGHUP and SIGTERM on Unix (src/signals.rs). crossterm already depends on
# signal-hook 0.3, so this adds no crate to the build.
[target.'cfg(unix)'.dependencies]
signal-hook = "0.3.18"

[dev-dependencies]
tempfile = "3.27.0"
